name: build-apk
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Extrair o zip do codigo-fonte
        run: |
          ZIP="$(ls -t ./*texture-lod*.zip 2>/dev/null | head -1)"
          if [ -z "$ZIP" ]; then
            ZIP="$(ls -t ./*.zip 2>/dev/null | head -1)"
          fi
          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum zip na raiz do repositorio."
            ls -la
            exit 1
          fi
          echo "Usando: $ZIP"
          mkdir _src
          unzip -q "$ZIP" -d _src
          cp -a _src/*/. .
          rm -rf _src
          ls

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Toolchain do engine
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" sh port/tools/android_toolchain.sh

      - name: Engine
        env:
          BT3_SKELETON: "1"
        run: python3 port/tools/android.py

      - name: Build do APK
        working-directory: android
        env:
          DR_VERSION_NAME: 0.5.0-dev.${{ github.run_number }}
          DR_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Procurar APKs
        run: find . -name "*.apk" | tee apks.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DragonRage-apk
          path: |
            **/*.apk
            apks.txt
